name: CI
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rumi
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rumi
      AUTH_SECRET: ci-secret-not-for-production
      TOKEN_ENCRYPTION_KEY: ci-token-key-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run build
  reels-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test tests/*.test.cjs
      - run: npm install --no-save --package-lock=false esbuild@0.28.2 playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/x-publishing-browser.cjs
      - run: node tests/guided-flow-browser.cjs
        env:
          GUIDED_QA_DIR: qa-guided-flow
      - run: node tests/reel-showcase-browser.cjs
        env:
          SHOWCASE_OUTPUT_DIR: qa-showcase
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: node tests/creative-template-browser.cjs
      - run: node tests/tiktok-posting-browser.cjs
      - run: node tests/publishing-position-browser.cjs
      - run: node tests/social-account-selection-browser.cjs
      - run: node tests/campaign-photo-browser.cjs
      - run: node tests/reels-browser.cjs
      - run: node tests/reels-browser.cjs
        env:
          REEL_QUICK_BROWSER: "1"
      - run: node tests/ai-lab-browser.cjs
      - run: node tests/ai-options-browser.cjs
      - run: node tests/video-logo-browser.cjs
      - run: node tests/exact-product-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: photo-options-evidence
          path: |
            qa-guided-flow/
            qa-photo-choices/
            qa-showcase/
            qa-ai-lab/
            qa-ai-options/
